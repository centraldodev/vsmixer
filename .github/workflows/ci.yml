name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore VSMixer.slnx

      - name: Check formatting
        run: dotnet format VSMixer.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build VSMixer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VSMixer.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        run: dotnet list VSMixer.csproj package --vulnerable --include-transitive
